owner: Spikko
repo: status

sites:
  - name: Company Website
    url: https://mobile2crm.com
    method: GET
    headers:
      - "Accept: text/html,application/xhtml+xml"
      - "User-Agent: Upptime/1.0 (+https://status.mobile2crm.com)"
  - name: Spikko Secure
    url: https://secure.spikko.com
    method: GET
    headers:
      - "Accept: text/html,application/xhtml+xml"
      - "User-Agent: Upptime/1.0 (+https://status.mobile2crm.com)"
  - name: Provisioning
    url: https://provision.mobile2crm.com/
    method: GET
    headers:
      - "Accept: text/html,application/xhtml+xml"
      - "User-Agent: Upptime/1.0 (+https://status.mobile2crm.com)"

# Internal services (e.g. SBC) are handled separately via the Grafana webhook,
# which opens/closes incident issues directly — they are not listed here.

status-website:
  cname: status.mobile2crm.com
  name: Mobile2CRM Status
  theme: dark
  logoUrl: https://mobile2crm.com/wp-content/uploads/2020/04/LogoM2c-Trans500-1-768x173.png
  favicon: https://mobile2crm.com/wp-content/uploads/2020/05/cropped-NewFavicon512-270x270.png
  themeUrl: https://cdn.statically.io/gh/Spikko/status/master/assets/status-theme.css
  introTitle: "**Mobile2CRM** status page"
  introMessage: Current operational status of Mobile2CRM services.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://mobile2crm.com
